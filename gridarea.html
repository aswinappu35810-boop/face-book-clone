<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .box{
            background-color: violet;

        }
        .grid-items{
            display: grid;
            grid-template-columns: 1fr 1fr 2fr 2fr;
            grid-template-rows: repeat(4, 150px);
            gap: 16px;
            grid-template-areas: "box-1 box-2 box-3 box-4"
                                 "box-1 box-5 box-5 box-4"
                                 "box-6 box-5 box-5 box-7"
                                 "box-6 box-8 box-9 box-9";
        }
    </style>
</head>
<body>
    <div class="grid-items">
        <div class="box" style="grid-area: box-1;"></div>
        <div class="box" style="grid-area: box-2;"></div>
        <div class="box" style="grid-area: box-3;"></div>
        <div class="box" style="grid-area: box-4;"></div>
        <div class="box" style="grid-area: box-5;"></div>
        <div class="box" style="grid-area: box-6;"></div>
        <div class="box" style="grid-area: box-7;"></div>
        <div class="box" style="grid-area: box-8;"></div>
        <div class="box" style="grid-area: box-9;"></div>
    </div>
</body>
</html>
