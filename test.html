<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>test</title>
    <style>
        body{
            background: #ffcfcf;
            justify-content: center;
            align-items: center;
            display: flex;
        }
        .container{
            display: flex;
            justify-content: space-between;
            width: 800px;
            height: 800px;
            background: #45454588;
        }
        .left{
            width: 200px;
            height: 800px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }
        .box1{
            width: 100%;
            height: 390px;
            background-color: rgb(255, 255, 255);
        }
        .box2{
            width: 100%;
            height: 390px;
            background-color: rgb(255, 0, 0);
        }
        .right{
            width: 590px;
            height: 800px;
            /* background: white; */
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .top{
            width: 100%;
            height: 610px;
            background-color: aquamarine;
        }
        .bottom{
            width: 100%;
            height: 180px;
            /* background: blue; */
            display: flex;
            justify-content: space-between;
        }

        .bottom-left{
            width: 290px;
            height: 100%;
            background-color: brown;
        }
        .bottom-right{
            width: 290px;
            height: 100%;
            background-color: green;
        }

    </style>
</head>
<body>
        <div class="container">
            <div class="left">
                <div class="box1"></div>
                <div class="box2"></div>
            </div>
            <div class="right">
                <div class="top"></div>
                <div class="bottom">

                    <div class="bottom-left"></div>
                    <div class="bottom-right"></div>

                </div>
            </div>
        </div>
</body>
</html>
