<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>grid</title>
    <style>
        .box{
            background-color: violet;
        }
        .grid-items{
            display: grid;
            grid-template-columns: 100px 100px;
            grid-template-rows: 100px 100px 100px;
            gap: 16px;
        }
    </style>
</head>
<body>
    <div class="grid-items">
        <div class="box"></div>
        <div class="box"></div>
        <div class="box"></div>
        <div class="box"></div>
        <div class="box"></div>
        <div class="box"></div>
    </div>
</body>
</html>
