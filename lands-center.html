<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css"/>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
         .sidebar::-webkit-scrollbar {
            display: none;
        }
    </style>
    <script>
    tailwind.config = {
    theme: {
        extend: {
        fontFamily: {
            poppins: ['Poppins', 'sans-serif'],
        },
        },
    },
    }
    </script>
    <title>Face book</title>
    <link rel="icon" href="facebook-og.svg">
</head>
<body class="bg-gradient-to-br from-[#F5EEF1] via-[#DDE8F5] to-[#E9F7F1] flex">
    <div class="container w-screen h-[100vh] bg-gradient-to-br from-[#F5EEF1] via-[#DDE8F5] to-[#E9F7F1] flex">

        <!-- side-bar -->
        <div class="sidebar side-bar fixed top-0 left-0 h-[100vh] w-[60px] bg-white flex flex-col items-center overflow-y-auto scroll-hide">
            <div class="w-[60px] h-[60px] flex justify-center items-center ">
                <img class="w-[45px] h-[45px] mt-[10px]" src="meta.png" alt="">
            </div>
           <div class="flex justify-center items-center mt-[30px] w-[60px] h-fit pr-[5px] relative">
             <div class="w-[60px] h-fit flex justify-center items-center z-50  cursor-pointer  ">
                <img class="w-[30px] h-[30px] rounded-[45px]" src="profile.png" alt="">
                <div class="ml-[-15px] mb-[-15px] w-[20px] h-[20px] rounded-[25px] bg-white flex justify-center items-center"><img class="w-[20px] h-[20px] rounded-[20px]" src="facebook-og.svg" alt=""></div>
            </div>
            <div class="w-[60px] h-fit flex justify-center items-center absolute top-[-7px] left-[5px]  cursor-pointer ">
                <img class="w-[30px] h-[30px] rounded-[45px]" src="profile.png" alt="">
                <div class="ml-[-15px] mb-[-15px] w-[18px] h-[18px] rounded-[7px] bg-white flex justify-center items-center"><img class="w-[16px] h-[16px] rounded-[20px]" src="instagram.png" alt=""></div>
            </div>
           </div>

           <div class="w-[60px] h-fit flex flex-col justify-start items-center gap-[2px] mt-[5px]">
                <div class="home w-[40px] h-[40px] rounded-[12px] hover:bg-[#E6E8EA]  flex justify-center items-center">
                <img src="home-solid.png" alt="">
            </div>
            <div class="w-[40px] h-[40px] rounded-[12px] hover:bg-[#E6E8EA] flex justify-center items-center relative">
                <img class="w-[35px] h-[35px]" src="bell-solid.png" alt="">
                <div class="w-[8px] h-[8px] rounded-full absolute top-[6px] right-[6px] bg-red-700"></div>
            </div>
            <div class="w-[40px] h-[40px] rounded-[12px] hover:bg-[#E6E8EA] flex justify-center items-center">
                <img class="w-[27px] h-[27px]" src="logo2.png" alt="">
            </div>
            <div class="w-[40px] h-[40px] rounded-[12px] hover:bg-[#E6E8EA] flex justify-center items-center relative">
                <img class="w-[30px] h-[30px]" src="chat.png" alt="">
                <!-- absolute-postion for red dot -->
                <div class="w-[8px] h-[8px] rounded-full absolute top-[6px] right-[6px] bg-red-700"></div>
            </div>
            <div class="w-[40px] h-[40px] rounded-[12px] hover:bg-[#E6E8EA] flex justify-center items-center">
                <img class="w-[33px] h-[33px]" src="logo-3.png" alt="">
            </div>
            <div class="w-[40px] h-[40px] rounded-[12px] hover:bg-[#E6E8EA] flex justify-center items-center">
                <img class="w-[22px] h-[22px]" src="calendar.svg" alt="">
                </div>
                <div class="w-[40px] h-[40px] rounded-[12px] hover:bg-[#E6E8EA] flex justify-center items-center">
                <img class="w-[22px] h-[22px]" src="horn.svg" alt="">
                </div>
                <div class="w-[40px] h-[40px] rounded-[12px] hover:bg-[#E6E8EA] flex justify-center items-center">
                <img class="w-[22px] h-[22px]" src="signal.svg" alt="">
                </div>
                <div class="w-[40px] h-[40px] rounded-[12px] hover:bg-[#E6E8EA] flex justify-center items-center">
                <img class="w-[33px] h-[33px]" src="live.png" alt="">
                </div>
                <div class="w-[42px] h-[42px] rounded-[8px] bg-[#283943] flex justify-center items-center relative">
                <div class="flex justify-center items-center w-[27px] h-[21px] rounded-[6px] border-[#20262D] bg-white border-[2px]"><img class="w-[26px] h-[26px] object-cover" src="group-1.png" alt=""></div>
                <div class="w-[8px] h-[8px] rounded-full absolute top-[7px] right-[6px] bg-red-700"></div>
                </div>
                <div class="w-[40px] h-[40px] rounded-[12px] hover:bg-[#E6E8EA] flex justify-center items-center mt-[2px]">
                <img class="w-[27px] h-[27px] ml-[2px]" src="whatsapp.svg" alt="">
                </div>
           </div>
           <hr class="w-[25px] h-[2px] bg-[#283943] mt-[10px]">
           <div class="w-[60px] h-fit flex flex-col justify-center items-center mt-[5px]">
                <div class="w-[40px] h-[40px] rounded-[12px] hover:bg-[#E6E8EA] flex justify-center items-center mt-[2px]">
                <img class="w-[27px] h-[27px]" src="search-black.svg" alt="">
                </div>
                <div class="w-[40px] h-[40px] rounded-[12px] hover:bg-[#E6E8EA] flex justify-center items-center mt-[2px]">
                <img class="w-[27px] h-[27px]" src="setting.svg" alt="">
                </div>
                <div class="w-[35px] h-[35px] rounded-full bg-[#F1F4F7] flex justify-center items-center mt-[2px]">
                <img class="w-[22px] h-[22px]" src="question_mark.svg" alt="">
                </div>
            </div>
        </div>


        <div class="main-section w-screen h-screen flex flex-col ml-[60px]">
            
            <!-- navbar -->
            <div class="nabar h-[50px] mt-[6px] ml-[15px]  flex items-center justify-between">
                <p class=" text-[#1C2B33] font-[600] font-poppins text-[20px]">Leads Centre</p>

                <div class="flex items-center justify-center w-fit h-[50px] gap-[10px]">
                    <div class="w-[155px] h-[40px] border-[1px] border-[#A7B2BF] bg-transparent rounded-[6px] flex justify-center items-center">  
                        <img class="mr-[10px] mt-[2px]" src="group.svg" alt=""> 
                        <select class="w-[100px] h-[45px] rounded-[8px] outline-none bg-transparent ml-[5px] font-semibold  text-[#26343C]">
                            <option value="Audiences">Audiences</option>
                            <option value="Audiences">Group</option>
                            <option value="Audiences">Video</option>
                        </select>
                    </div>

                    <div class="w-[40px] h-[40px] rounded-[6px] border-[1px] border-[#A7B2BF] bg-transparent">
                        <img src="downloded-1.png" alt="">
                    </div>
                    <div class="w-[40px] h-[40px] rounded-[6px] border-[1px] border-[#A7B2BF] bg-transparent">
                        <img src="bell-solid.png" alt="">
                    </div>
                    <div class="w-[40px] h-[40px] rounded-[6px] border-[1px] border-[#A7B2BF] bg-transparent">
                        <img src="settings-1.png" alt="">
                    </div>
                    <div class="w-[155px] h-[40px] border-[1px] border-[#A7B2BF] bg-[#1175BB] rounded-[6px] flex justify-center items-center mr-[10px]">  
                    <img class="mr-[10px] mt-[2px]" src="add.svg" alt=""> 
                    <select class="w-[100px] h-[45px] rounded-[8px] outline-none bg-transparent ml-[5px] font-semibold  text-[#e3e3e3]">
                        <option value="Audiences">Add Leads</option>
                        <option value="Audiences">Group</option>
                        <option value="Audiences">Video</option>
                    </select>
                    </div>
                    
                    <div class="w-[45px] h-[45px] flex justify-center items-center relative  cursor-pointer mr-[20px]">
                        <img class="w-[40px] h-[40px] rounded-full" src="profile.png" alt="">
                        <div class="ml-[-15px] mb-[-18px] w-[20px] h-[20px] rounded-[25px] bg-[#dde9f4] flex justify-center items-center">
                            <img class="w-[20px] h-[20px] rounded-[20px]" src="facebook-og.svg" alt="">
                        </div>
                    </div>


                </div>


            </div>
            
            
            
            
            
            
        </div>

    </div>
</body>
</html>
